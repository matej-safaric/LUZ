<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slovenia-map</title>
  </head>


  <body>
    <button id="sync-button">Sync 3D to 2D</button>
    <div id="app">
      <!-- OpenLayers 2D map: -->
      <div id="map-2d"></div>

      <!-- Cesium 3D map-->
      <div id="map-3d"></div>
      
      <!-- Map controls -->
      <div id="map-controls">
        <!-- One button per 2D raster layer, filled in by layerControls.js -->
        <div id="layer-2d-controls" class="layer-controls"></div>
        
        
        <br>
        <button id="toggle-3d-button" type="button">
          Show 3D
        </button>
        <br><br>
        <button id="point-mode-button">
          Enter point mode
        </button>

        <button id="line-mode-button">
          Enter line mode
        </button>
        <br><br>

      <button id="roadsMOL-button" type="button" aria-pressed="false">
        Roads MOL
      </button>

      <button id="roads_OS_DC-button" type="button" aria-pressed="false">
        Roads OS DC 2026
      </button>

      <button id="polygons-button" type="button" aria-pressed="false">
        Polygons
      </button>

      <button id="draped-mesh-button" type="button" aria-pressed="false">
        Draped mesh
      </button>

      </div>
    </div>  

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
